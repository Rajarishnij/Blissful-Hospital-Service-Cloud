<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediCare Plus - Request Received</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #a8e6cf, #56ab2f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
  }
  .card {
    background: #ffffff;
    max-width: 480px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    text-align: center;
    padding: 40px 28px;
  }
  .icon {
    font-size: 56px;
    margin-bottom: 10px;
  }
  h1 {
    color: #2c3e50;
    margin: 10px 0;
    font-size: 22px;
  }
  p {
    color: #636e72;
    font-size: 14px;
    line-height: 1.6;
  }
  .sla-box {
    margin-top: 20px;
    background: #f1f9f4;
    border: 1px solid #a8e6cf;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    color: #2d6a4f;
  }
  a.btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 26px;
    background: linear-gradient(135deg, #2980b9, #6dd5fa);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Thank You!</h1>
    <p>Your support request has been received. A case has been created and our team will reach out to you shortly based on your query's priority level.</p>
    <div class="sla-box">
      ⏱️ Emergency queries: response within <b>15 minutes</b><br>
      Regular queries: response within <b>4 hours</b>
    </div>
    <a class="btn" href="web-to-case-form.html">Submit Another Request</a>
  </div>
</body>
</html>
